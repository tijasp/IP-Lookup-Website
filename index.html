<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>

    <title>IP Lookup</title>
</head>

<body>
    <header>
        <h1>My IP Address: <span id="myIp"></span></h1>
    </header>

    <main>

        <section class="mainSection">
            <section class="getIpDetailsButtonGroup">
                <input type="text" id="ipInput" placeholder="Enter IP Address">
                <button id="getIpDetailsButton">Get IP details</button>
            </section>

            <h2>What informations will I get ?</h2>
            <br>
            <ul>
                <li>- The ISP</li>
                <li>- The country</li>
                <li>- The region/state</li>
                <li>- The city</li>
                <li>- The latitude and longitude of the location</li>
                <li>- The timezone</li>
            </ul>
            <br>
            <p>Please note that the location is approximate.</p>
        </section>

    </main>
</body>
</html>
